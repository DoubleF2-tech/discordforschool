
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5865f2">
<title>SchoolCord</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#313338;--side:#1e1f22;--panel:#2b2d31;--hover:#383a40;--text:#f2f3f5;--muted:#a0a5ad;--accent:#5865f2;--line:#42444b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:5px}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent)}.hidden{display:none!important}button.primary{background:var(--accent);color:white;padding:11px 15px;font-weight:bold}button.secondary{background:var(--hover);color:white;padding:10px 13px}button.danger{background:#da373c;color:white;padding:8px 10px}.login{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:18px;background:#17181b;overflow:auto}.login-card{background:var(--bg);padding:28px;border-radius:10px;width:min(420px,100%)}h1{font-size:27px;margin:0 0 9px}.muted{color:var(--muted);line-height:1.5}.field{margin:14px 0}.field label{display:block;margin-bottom:7px;color:var(--muted);font-size:11px;font-weight:bold}.field input,.field textarea,.field select{width:100%;background:var(--side);border:1px solid var(--line);color:var(--text);border-radius:5px;padding:11px}.login-card .primary{width:100%}.error{color:#ff8585;margin-top:10px;white-space:pre-wrap}.app{height:100dvh;display:flex;overflow:hidden}.sidebar{width:245px;background:var(--side);display:flex;flex-direction:column;flex-shrink:0}.brand{padding:17px;font-size:17px;font-weight:bold;border-bottom:1px solid #1112}.brand span{color:var(--accent)}.section-label{padding:17px 12px 7px;color:var(--muted);font-size:11px;font-weight:bold}.channels{flex:1;overflow:auto;padding:0 8px}.channel{width:100%;text-align:left;color:var(--muted);background:transparent;padding:10px;margin-bottom:3px}.channel:hover,.channel.active{background:var(--hover);color:white}.me{display:flex;align-items:center;gap:9px;padding:12px;background:#17181b}.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--accent);display:grid;place-items:center;font-weight:bold;flex-shrink:0}.me-info{flex:1;min-width:0;overflow:hidden}.me-info strong{display:block;overflow:hidden;text-overflow:ellipsis}.me-info small{color:var(--muted)}.iconbtn{background:transparent;color:var(--muted);padding:8px}.iconbtn:hover{background:var(--hover);color:white}.main{min-width:0;flex:1;display:flex;flex-direction:column}.top{height:54px;display:flex;align-items:center;gap:10px;padding:0 17px;border-bottom:1px solid var(--line);font-weight:bold}.top .muted{font-size:12px;font-weight:normal;margin-left:auto}.chat{flex:1;overflow:auto;padding:20px}.banner{width:100%;max-height:150px;object-fit:cover;border-radius:8px;margin-bottom:14px}.message{display:flex;gap:11px;padding:10px 5px;border-radius:5px}.message:hover{background:#ffffff06}.message-body{min-width:0;flex:1}.message-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}.message-head strong{overflow-wrap:anywhere}.time{font-size:11px;color:var(--muted)}.badge{font-size:9px;font-weight:bold;background:#4752c4;border-radius:4px;padding:3px 5px}.message-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}.delete{margin-left:auto;background:transparent;color:#ff8585;padding:4px 7px}.composer-wrap{padding:10px 18px 18px}.composer{display:flex;gap:10px;align-items:flex-end;background:var(--panel);padding:10px;border-radius:8px}.composer textarea{flex:1;resize:vertical;min-height:25px;max-height:130px;background:transparent;color:white;border:0;outline:none}.composer button{background:var(--accent);color:white;padding:10px}.hint{color:var(--muted);font-size:10px;text-align:center;margin-top:8px}.members{width:195px;padding:17px 12px;background:#292b30;overflow:auto}.member{display:flex;align-items:center;gap:8px;padding:7px 0;overflow-wrap:anywhere}.member .avatar{width:29px;height:29px}.modal-backdrop{position:fixed;inset:0;background:#000a;z-index:20;display:grid;place-items:center;padding:15px}.modal{width:min(470px,100%);max-height:90dvh;overflow:auto;background:var(--bg);padding:23px;border-radius:9px}.modal h2{margin:0 0 7px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px;flex-wrap:wrap}.swatches{display:flex;gap:10px;flex-wrap:wrap}.swatch{width:34px;height:34px;border-radius:50%;border:3px solid #ffffff55}.notice{background:var(--side);padding:10px;border-radius:6px;color:var(--muted);font-size:12px;line-height:1.5}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:40;background:#111;padding:12px 17px;border-radius:7px;max-width:90%;box-shadow:0 4px 20px #0007}
@media(max-width:760px){.members{display:none}.sidebar{width:190px}.top .muted{display:none}.chat{padding:12px}.composer-wrap{padding:8px}.brand{padding:13px}.me{padding:8px}}@media(max-width:480px){.sidebar{width:145px}.brand{font-size:14px}.me-info small{font-size:10px}.iconbtn{padding:5px}}
</style>
</head>
<body>
<div class="login" id="loginScreen">
 <div class="login-card">
  <div style="font-size:36px;color:var(--accent);font-weight:bold">S</div>
  <h1>Welcome to SchoolCord</h1>
  <p class="muted">Your community. Your conversations.</p>
  <form id="authForm">
   <div class="field"><label for="email">EMAIL</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div>
   <div class="field"><label for="password">PASSWORD</label><input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="Your password"></div>
   <div class="field" id="usernameField"><label for="username">USERNAME (FOR NEW ACCOUNTS)</label><input id="username" maxlength="24" placeholder="Choose a username" autocomplete="username"></div>
   <button class="primary" id="authButton" type="submit">Sign in</button>
  </form>
  <p style="text-align:center;margin-top:17px"><button class="iconbtn" id="switchAuth" type="button">Need an account? Sign up</button></p>
  <div class="error" id="authError" role="alert"></div>
  <p class="muted" style="font-size:11px">Use your own account. Never share your password with other users.</p>
 </div>
</div>

<div class="app hidden" id="app">
 <aside class="sidebar">
  <div class="brand"><span>S</span> SchoolCord</div>
  <div class="section-label">TEXT CHANNELS</div>
  <div class="channels" id="channelList"></div>
  <div class="me">
   <img class="avatar" id="myAvatar" alt="" src="" style="display:none">
   <div class="avatar" id="myInitial">S</div>
   <div class="me-info"><strong id="myName">User</strong><small id="myRole">Member</small></div>
   <button class="iconbtn" id="profileButton" title="Customize profile">⚙</button>
   <button class="iconbtn" id="logoutButton" title="Sign out">↪</button>
  </div>
 </aside>
 <main class="main">
  <header class="top"><span style="color:var(--muted)">#</span><span id="channelTitle">general</span><span class="muted" id="channelTopic">Welcome to SchoolCord</span></header>
  <section class="chat" id="chat"><div id="bannerArea"></div><div id="messages"></div></section>
  <div class="composer-wrap">
   <form class="composer" id="messageForm"><textarea id="messageInput" rows="1" maxlength="2000" placeholder="Message #general" aria-label="Message"></textarea><button type="submit">➤</button></form>
   <div class="hint">Be kind. Keep personal information private.</div>
  </div>
 </main>
 <aside class="members"><div class="section-label" style="padding-top:0">CHANNEL MEMBERS</div><div id="memberList" class="muted">Sign in to chat.</div></aside>
</div>

<div class="modal-backdrop hidden" id="modalBackdrop">
 <div class="modal">
  <h2 id="modalTitle">Profile settings</h2>
  <p class="muted" id="modalDescription"></p>
  <div id="modalBody"></div>
  <div class="modal-actions" id="modalActions"></div>
 </div>
</div>
<div class="toast hidden" id="toast"></div>

<script>
"use strict";
const SUPABASE_URL="https://bqvpsbcvdivuajehocag.supabase.co";
const SUPABASE_KEY="sb_publishable_qHH0hRblnYrf1Fv_Urv8qg_rvtX3xGU";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const DEFAULT_CHANNELS=["general","introductions","gaming","help"];
const COLORS=["#5865f2","#ed4245","#3ba55c","#f0b232","#eb459e","#00a8fc","#9b59b6","#ff7043"];
let user=null,profile=null,channels=[],currentChannel=null,staffRole=null,authMode="signin",subscription=null,toastTimer=null;
let knownProfiles={};

function toast(message){$("toast").textContent=message;$("toast").classList.remove("hidden");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").classList.add("hidden"),3200)}
function escapeHTML(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function roleFor(username){if(staffRole&&String(staffRole.username||"").toLowerCase()===String(username||"").toLowerCase())return staffRole.role;return null}
function roleLabel(role){return role==="owner"?"👑 OWNER":role==="mod"?"🛡️ MODERATOR":""}
function setAccent(color){if(!/^#[0-9a-f]{6}$/i.test(color||""))return;document.documentElement.style.setProperty("--accent",color)}
function displayName(p){return p?.display_name||p?.username||"Member"}
function avatarMarkup(p){const url=p?.avatar_url;if(url)return '<img class="avatar" alt="" src="'+escapeHTML(url)+'">';return '<div class="avatar">'+escapeHTML(displayName(p).charAt(0).toUpperCase())+'</div>'}
function openModal(title,description,body){$("modalTitle").textContent=title;$("modalDescription").textContent=description||"";$("modalBody").replaceChildren(body);$("modalActions").replaceChildren();$("modalBackdrop").classList.remove("hidden")}
function closeModal(){$("modalBackdrop").classList.add("hidden")}
function field(label,id,value,type="text",placeholder=""){const wrap=document.createElement("div");wrap.className="field";const l=document.createElement("label");l.htmlFor=id;l.textContent=label;const input=document.createElement("input");input.id=id;input.type=type;input.value=value||"";input.placeholder=placeholder;wrap.append(l,input);return wrap}
function addAction(label,cls,callback){const b=document.createElement("button");b.type="button";b.className=cls;b.textContent=label;b.onclick=callback;$("modalActions").appendChild(b);return b}
function showAuthError(message){$("authError").textContent=message}
$("switchAuth").onclick=()=>{authMode=authMode==="signin"?"signup":"signin";$("authButton").textContent=authMode==="signin"?"Sign in":"Create account";$("switchAuth").textContent=authMode==="signin"?"Need an account? Sign up":"Already have an account? Sign in";$("usernameField").classList.toggle("hidden",authMode!=="signup");$("password").autocomplete=authMode==="signin"?"current-password":"new-password";showAuthError("")};
$("authForm").addEventListener("submit",async e=>{
 e.preventDefault();showAuthError("");const email=$("email").value.trim(),password=$("password").value,username=$("username").value.trim();
 const btn=$("authButton");btn.disabled=true;btn.textContent="Please wait…";
 try{
  if(authMode==="signup"){
   if(!/^[\p{L}\p{N}_ -]{2,24}$/u.test(username))throw Error("Choose a username between 2 and 24 characters.");
   const {data,error}=await db.auth.signUp({email,password,options:{data:{username}}});if(error)throw error;
   if(!data.session){showAuthError("Account created! Check your email to confirm your account, then sign in.");return}
   user=data.user;
  }else{
   const {data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;user=data.user;
  }
  await startApp();
 }catch(err){showAuthError(err.message||"Sign-in failed.")}finally{btn.disabled=false;btn.textContent=authMode==="signin"?"Sign in":"Create account"}
});
async function loadProfile(){
 const {data,error}=await db.from("profiles").select("*").eq("id",user.id).maybeSingle();if(error)throw error;
 if(data){profile=data;return}
 const username=String(user.user_metadata?.username||user.email?.split("@")[0]||"member").slice(0,24);
 const {data:created,error:e}=await db.from("profiles").insert({id:user.id,username,display_name:username}).select("*").single();
 if(e)throw e;profile=created;
}
async function loadStaff(){
 staffRole=null;
 const {data,error}=await db.from("schoolcord_staff").select("username,role").eq("user_id",user.id).maybeSingle();
 if(!error&&data)staffRole=data;
}
async function startApp(){
 $("loginScreen").classList.add("hidden");$("app").classList.remove("hidden");
 try{
  await loadProfile();await loadStaff();
  setAccent(profile.accent_color||"#5865f2");
  $("myName").textContent=displayName(profile);
  $("myRole").textContent=staffRole?roleLabel(staffRole.role):"Online";
  $("myInitial").style.display=profile.avatar_url?"none":"grid";
  $("myAvatar").style.display=profile.avatar_url?"block":"none";
  if(profile.avatar_url)$("myAvatar").src=profile.avatar_url;
  else $("myInitial").textContent=displayName(profile).charAt(0).toUpperCase();
  await loadChannels();await loadMembers();subscribeMessages();
 }catch(e){toast("Could not load SchoolCord: "+e.message);console.error(e)}
}
async function loadChannels(){
 const {data,error}=await db.from("channels").select("*");if(error)throw error;
 channels=(data||[]).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
 if(!channels.length)throw Error("No channels found. Create general, introductions, gaming, and help in your Supabase channels table.");
 if(!channels.some(c=>String(c.id)===String(currentChannel)))currentChannel=channels.find(c=>c.name==="general")?.id??channels[0].id;
 renderChannels();await loadMessages();
}
function renderChannels(){
 const list=$("channelList");list.replaceChildren();
 channels.forEach(c=>{const b=document.createElement("button");b.className="channel"+(String(c.id)===String(currentChannel)?" active":"");b.textContent="#  "+c.name;b.onclick=async()=>{currentChannel=c.id;renderChannels();await loadMessages();subscribeMessages()};list.appendChild(b)});
 const c=channels.find(x=>String(x.id)===String(currentChannel));$("channelTitle").textContent=c?.name||"general";$("messageInput").placeholder="Message #"+(c?.name||"general");
}
async function loadMessages(){
 const {data,error}=await db.from("messages").select("*").eq("channel_id",currentChannel).order("created_at",{ascending:true}).limit(150);
 if(error){toast("Could not load messages: "+error.message);return}
 await renderMessages(data||[]);
}
async function profileFor(id){
 if(knownProfiles[id])return knownProfiles[id];
 const {data,error}=await db.from("profiles").select("id,username,display_name,avatar_url,banner_url,bio,accent_color").eq("id",id).maybeSingle();
 if(!error&&data)knownProfiles[id]=data;
 return data||{username:"Member",display_name:"Member"};
}
async function renderMessages(rows){
 const box=$("messages");box.replaceChildren();
 for(const m of rows){
  const p=await profileFor(m.user_id),role=roleFor(p.username);
  const row=document.createElement("article");row.className="message";row.dataset.id=m.id;
  const avatar=p.avatar_url?Object.assign(document.createElement("img"),{className:"avatar",alt:"",src:p.avatar_url}):Object.assign(document.createElement("div"),{className:"avatar",textContent:displayName(p).charAt(0).toUpperCase()});
  const body=document.createElement("div");body.className="message-body";
  const head=document.createElement("div");head.className="message-head";
  const author=document.createElement("strong");author.textContent=m.username||displayName(p);head.append(author);
  if(role){const badge=document.createElement("span");badge.className="badge";badge.textContent=roleLabel(role);head.append(badge)}
  const time=document.createElement("span");time.className="time";time.textContent=m.created_at?new Date(m.created_at).toLocaleString(): "";head.append(time);
  if(staffRole&&(staffRole.role==="owner"||staffRole.role==="mod")){
   const del=document.createElement("button");del.className="delete";del.type="button";del.textContent="Delete";del.title="Delete public channel message";del.onclick=()=>deleteChannelMessage(m.id);head.append(del);
  }
  const text=document.createElement("div");text.className="message-text";text.textContent=m.content;
  body.append(head,text);row.append(avatar,body);box.append(row);
 }
 $("chat").scrollTop=$("chat").scrollHeight;
}
async function loadMembers(){
 const {data,error}=await db.from("profiles").select("id,username,display_name,avatar_url").limit(100);if(error)return;
 const list=$("memberList");list.replaceChildren();
 (data||[]).forEach(p=>{knownProfiles[p.id]={...(knownProfiles[p.id]||{}),...p};const r=document.createElement("div");r.className="member";const a=p.avatar_url?Object.assign(document.createElement("img"),{className:"avatar",src:p.avatar_url,alt:""}):Object.assign(document.createElement("div"),{className:"avatar",textContent:displayName(p).charAt(0).toUpperCase()});const name=document.createElement("span");name.textContent=displayName(p);name.style.overflowWrap="anywhere";r.append(a,name);list.append(r)});
}
function subscribeMessages(){
 if(subscription){db.removeChannel(subscription);subscription=null}
 subscription=db.channel("schoolcord-messages-"+String(currentChannel)).on("postgres_changes",{event:"*",schema:"public",table:"messages",filter:"channel_id=eq."+currentChannel},async payload=>{
  if(payload.eventType==="DELETE"){const row=document.querySelector('[data-id="'+CSS.escape(String(payload.old.id))+'"]');row?.remove();return}
  await loadMessages();
 }).subscribe();
}
async function sendMessage(e){
 e.preventDefault();const input=$("messageInput"),content=input.value.trim();if(!content||!user||!currentChannel)return;
 const button=e.submitter;if(button)button.disabled=true;
 try{const {error}=await db.from("messages").insert({channel_id:currentChannel,user_id:user.id,username:profile.username,content});if(error)throw error;input.value="";await loadMessages()}
 catch(err){toast("Message failed: "+err.message)}finally{if(button)button.disabled=false}
}
$("messageForm").addEventListener("submit",sendMessage);
async function deleteChannelMessage(id){
 if(!confirm("Delete this message for everyone in this channel?"))return;
 try{const {data,error}=await db.rpc("schoolcord_delete_channel_message",{p_message_id:String(id)});if(error)throw error;if(!data)throw Error("The message was not deleted.");toast("Message deleted.");await loadMessages()}
 catch(e){toast("Delete failed: "+e.message)}
}
async function uploadImage(file){
 if(!file)return null;if(!file.type.startsWith("image/"))throw Error("Choose an image file.");
 if(file.size>5*1024*1024)throw Error("Images must be 5 MB or smaller.");
 const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
 const path=user.id+"/"+Date.now()+"-"+crypto.randomUUID()+"."+ext;
 const {error}=await db.storage.from("schoolcord-media").upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;
 const {data}=db.storage.from("schoolcord-media").getPublicUrl(path);return data.publicUrl;
}
function editProfile(){
 const wrap=document.createElement("div");
 wrap.append(field("Display name","editDisplay",profile.display_name||profile.username),field("Avatar image URL (optional)","editAvatar",profile.avatar_url||""),field("Banner image URL (optional)","editBanner",profile.banner_url||""),field("Bio","editBio",profile.bio||""),field("Accent colour","editColor",profile.accent_color||"#5865f2","color"));
 const avatarFile=field("Upload avatar image","uploadAvatar","","file");avatarFile.querySelector("input").accept="image/*";
 const bannerFile=field("Upload banner image","uploadBanner","","file");bannerFile.querySelector("input").accept="image/*";
 wrap.append(avatarFile,bannerFile);
 const palettes=document.createElement("div");palettes.className="field";const label=document.createElement("label");label.textContent="QUICK THEMES";const swatches=document.createElement("div");swatches.className="swatches";
 COLORS.forEach(c=>{const b=document.createElement("button");b.type="button";b.className="swatch";b.style.background=c;b.title=c;b.onclick=()=>{$("editColor").value=c};swatches.append(b)});palettes.append(label,swatches);wrap.append(palettes);
 openModal("Customize your profile","Changes are saved to your Supabase profile.",wrap);
 addAction("Cancel","secondary",closeModal);
 addAction("Save profile","primary",async()=>{
  const save=$("modalActions").querySelector(".primary");save.disabled=true;save.textContent="Saving…";
  try{
   let avatar=$("editAvatar").value.trim(),banner=$("editBanner").value.trim();
   const af=$("uploadAvatar").files[0],bf=$("uploadBanner").files[0];
   if(af)avatar=await uploadImage(af);if(bf)banner=await uploadImage(bf);
   const update={display_name:$("editDisplay").value.trim()||profile.username,avatar_url:avatar||null,banner_url:banner||null,bio:$("editBio").value.trim(),accent_color:$("editColor").value};
   const {data,error}=await db.from("profiles").update(update).eq("id",user.id).select("*").single();if(error)throw error;
   profile=data;knownProfiles[user.id]=data;setAccent(data.accent_color);closeModal();await startApp();toast("Profile updated!");
  }catch(e){toast("Profile save failed: "+e.message);save.disabled=false;save.textContent="Save profile"}
 });
}
$("profileButton").onclick=editProfile;
$("logoutButton").onclick=async()=>{if(subscription)await db.removeChannel(subscription);await db.auth.signOut();user=null;profile=null;staffRole=null;$("app").classList.add("hidden");$("loginScreen").classList.remove("hidden");$("password").value=""};
$("modalBackdrop").addEventListener("click",e=>{if(e.target===$("modalBackdrop"))closeModal()});
(async()=>{
 const {data:{session},error}=await db.auth.getSession();
 if(error){showAuthError(error.message);return}
 if(session){user=session.user;await startApp()}
 db.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT"){user=null;$("app").classList.add("hidden");$("loginScreen").classList.remove("hidden")}});
})();
</script>
</body>
</html>
