

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5865f2">
<title>SchoolCord</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#1e1f22;--panel:#2b2d31;--side:#232428;--accent:#5865f2;--text:#f2f3f5;--muted:#b5bac1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer;border:0;border-radius:5px;padding:11px 15px;background:var(--accent);color:white;font-weight:bold}
button:disabled{opacity:.5;cursor:wait}
input{width:100%;padding:12px;border-radius:5px;border:1px solid #41434a;background:#1e1f22;color:white;outline-color:var(--accent)}
small,.muted{color:var(--muted)}
.hidden{display:none!important}
#auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#343b75,#1e1f22 65%)}
.authbox{width:min(420px,100%);background:var(--panel);padding:30px;border-radius:12px;box-shadow:0 15px 55px #0005}
.logo{font-size:27px;font-weight:800;letter-spacing:-1px}
.logo span{color:#8290ff}
.authbox h2{margin-bottom:7px}
.stack{display:grid;gap:13px;margin-top:22px}
#status{min-height:20px;font-size:13px;color:#ffb4b4;overflow-wrap:anywhere}
.switch{text-align:center;margin-top:17px;color:var(--muted)}
.switch button{background:none;color:#aab4ff;padding:3px}
#app{height:100dvh;display:grid;grid-template-columns:225px minmax(0,1fr);overflow:hidden}
.sidebar{background:var(--side);padding:17px 12px;display:flex;flex-direction:column;min-height:0}
.brand{padding:7px 10px 23px;font-size:22px;font-weight:bold}
.brand span{color:#8290ff}
.server{padding:13px;background:#2b2d31;border-radius:7px;margin-bottom:17px;font-weight:bold}
.section{font-size:11px;color:var(--muted);font-weight:bold;text-transform:uppercase;padding:12px 10px 7px;letter-spacing:.7px}
.channel{display:block;text-align:left;width:100%;background:transparent;color:var(--muted);padding:10px;border-radius:5px;font-weight:normal}
.channel:hover,.channel.active{background:#393b43;color:white}
.userbox{margin-top:auto;padding:12px 8px;background:#191a1d;border-radius:7px;overflow-wrap:anywhere}
.userline{display:flex;gap:8px;align-items:center}
.avatar{width:34px;height:34px;border-radius:50%;background:#5865f2;display:grid;place-items:center;font-weight:bold;flex-shrink:0}
#logout{background:#393b43;margin-top:12px;width:100%}
.chat{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{height:61px;border-bottom:1px solid #191a1d;display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px}
.topbar h2{font-size:17px;margin:0}
#connection{font-size:12px;color:var(--muted)}
#messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.welcome{margin:auto;text-align:center;max-width:390px;color:var(--muted);line-height:1.6}
.message{display:flex;gap:12px;align-items:flex-start}
.messagebody{min-width:0;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.5}
.messagehead{margin-bottom:5px}
.messagehead strong{font-size:14px}
.messagehead time{font-size:11px;color:var(--muted);margin-left:8px}
.composer{padding:0 20px 20px}
.composer form{display:flex;gap:10px;background:#383a40;padding:10px;border-radius:9px}
.composer input{border:0;background:transparent;min-width:0}
#send{flex-shrink:0}
#notice{min-height:19px;color:var(--muted);font-size:12px;padding:3px 4px}
@media(max-width:650px){
#app{grid-template-columns:76px minmax(0,1fr)}
.sidebar{padding:10px 6px}
.brand{font-size:0;text-align:center;padding:10px 0 20px}
.brand:after{content:"SC";font-size:20px}
.server{font-size:0;text-align:center;padding:12px 0}
.server:after{content:"S";font-size:17px}
.section{font-size:0;padding:8px 0}
.channel{font-size:0;text-align:center;padding:13px 3px}
.channel:before{content:"#";font-size:18px}
.userbox{padding:8px 3px;text-align:center}
.userline{justify-content:center}
#usernameDisplay{display:none}
#logout{font-size:0;padding:9px 0}
#logout:after{content:"↪";font-size:18px}
.topbar{padding:0 12px}
#messages{padding:14px 10px}
.composer{padding:0 9px 10px}
.composer form{gap:5px;padding:7px}
#send{padding:10px}
}
</style>
</head>
<body>
<section id="auth">
  <div class="authbox">
    <div class="logo">School<span>Cord</span></div>
    <h2 id="authTitle">Welcome back!</h2>
    <p class="muted" id="authDescription">Sign in to join your community.</p>
    <form id="authForm" class="stack">
      <div id="usernameField" class="hidden">
        <label for="username">Username</label>
        <input id="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" autocomplete="username" placeholder="Choose a username">
        <small>3–24 letters, numbers or underscores.</small>
      </div>
      <div>
        <label for="email">Email address</label>
        <input id="email" type="email" required autocomplete="email" placeholder="you@example.com">
      </div>
      <div>
        <label for="password">Password</label>
        <input id="password" type="password" required minlength="8" autocomplete="current-password" placeholder="At least 8 characters">
      </div>
      <button id="authSubmit" type="submit">Log in</button>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
    <div class="switch"><span id="switchText">New to SchoolCord?</span> <button id="switchMode" type="button">Create an account</button></div>
  </div>
</section>

<section id="app" class="hidden">
  <aside class="sidebar">
    <div class="brand">School<span>Cord</span></div>
    <div class="server">SchoolCord Community</div>
    <div class="section">Text channels</div>
    <nav id="channelList" aria-label="Chat channels">
      <button class="channel active" data-channel="general"># general</button>
      <button class="channel" data-channel="introductions"># introductions</button>
      <button class="channel" data-channel="gaming"># gaming</button>
      <button class="channel" data-channel="help"># help</button>
    </nav>
    <div class="userbox">
      <div class="userline"><div class="avatar" id="avatar">?</div><strong id="usernameDisplay">User</strong></div>
      <button id="logout" type="button">Log out</button>
    </div>
  </aside>
  <main class="chat">
    <header class="topbar">
      <h2 id="channelTitle"># general</h2>
      <span id="connection">Connecting…</span>
    </header>
    <div id="messages" aria-live="polite">
      <div class="welcome"><h2>Welcome to SchoolCord!</h2><p>Messages from this channel will appear here.</p></div>
    </div>
    <div class="composer">
      <form id="messageForm">
        <input id="messageInput" maxlength="2000" autocomplete="off" placeholder="Message #general…" aria-label="Message" required>
        <button id="send" type="submit">Send</button>
      </form>
      <div id="notice" role="status" aria-live="polite"></div>
    </div>
  </main>
</section>

<script>
/* ================= SUPABASE SETTINGS =================
   Replace both placeholders with your own project details.
   Use your Project URL and Publishable key only.
====================================================== */
const SUPABASE_URL = "YOUR_PROJECT_URL";
const SUPABASE_KEY = "YOUR_PUBLISHABLE_KEY";

const $ = id => document.getElementById(id);
const authSection = $("auth");
const appSection = $("app");
const authForm = $("authForm");
const statusBox = $("status");
const notice = $("notice");

let supabaseClient = null;
let currentUser = null;
let currentProfile = null;
let currentChannel = "general";
let realtimeSubscription = null;
let signupMode = false;
let busy = false;

function setStatus(message, error = true) {
  statusBox.textContent = message;
  statusBox.style.color = error ? "#ffb4b4" : "#a5f3c1";
}
function setNotice(message) { notice.textContent = message; }

function configureAuthMode() {
  $("authTitle").textContent = signupMode ? "Create your account" : "Welcome back!";
  $("authDescription").textContent = signupMode
    ? "Create an account to join SchoolCord."
    : "Sign in to join your community.";
  $("usernameField").classList.toggle("hidden", !signupMode);
  $("username").required = signupMode;
  $("authSubmit").textContent = signupMode ? "Create account" : "Log in";
  $("switchText").textContent = signupMode ? "Already have an account?" : "New to SchoolCord?";
  $("switchMode").textContent = signupMode ? "Log in" : "Create an account";
  $("password").autocomplete = signupMode ? "new-password" : "current-password";
  setStatus("");
}
$("switchMode").addEventListener("click", () => {
  signupMode = !signupMode;
  configureAuthMode();
});

function showApp() {
  authSection.classList.add("hidden");
  appSection.classList.remove("hidden");
}
function showAuth() {
  appSection.classList.add("hidden");
  authSection.classList.remove("hidden");
}

function escapeText(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[c]);
}

function renderMessage(message) {
  if ($("message-" + message.id)) return;
  const welcome = $("messages").querySelector(".welcome");
  if (welcome) welcome.remove();

  const item = document.createElement("article");
  item.className = "message";
  item.id = "message-" + message.id;
  const initial = (message.username || "?").charAt(0).toUpperCase();
  const date = new Date(message.created_at);
  const time = Number.isNaN(date.getTime()) ? "" : date.toLocaleString();
  item.innerHTML =
    '<div class="avatar">' + escapeText(initial) + '</div>' +
    '<div class="messagebody"><div class="messagehead"><strong>' +
    escapeText(message.username) + '</strong><time>' + escapeText(time) +
    '</time></div><div>' + escapeText(message.content) + '</div></div>';
  $("messages").appendChild(item);
  $("messages").scrollTop = $("messages").scrollHeight;
}

async function ensureProfile(user) {
  const wanted = user.user_metadata?.username;
  let {data: profile, error} = await supabaseClient
    .from("profiles").select("id,username").eq("id", user.id).maybeSingle();

  if (error) throw error;

  if (!profile) {
    if (!wanted) throw new Error("Your profile is missing. Please contact the site administrator.");
    const {data, error: insertError} = await supabaseClient
      .from("profiles")
      .insert({id:user.id, username:wanted})
      .select("id,username").single();

    if (insertError) {
      // Handle an account whose profile was created by another session.
      const retry = await supabaseClient.from("profiles")
        .select("id,username").eq("id", user.id).maybeSingle();
      if (retry.error || !retry.data) throw insertError;
      profile = retry.data;
    } else {
      profile = data;
    }
  }
  return profile;
}

async function loadMessages() {
  $("messages").innerHTML = '<div class="welcome"><p>Loading messages…</p></div>';
  setNotice("");
  const {data, error} = await supabaseClient
    .from("messages")
    .select("id,channel_id,user_id,username,content,created_at")
    .eq("channel_id", currentChannel)
    .order("created_at", {ascending:true})
    .limit(100);

  if (error) {
    $("messages").innerHTML = '<div class="welcome"><p>Could not load messages.</p></div>';
    setNotice(error.message);
    return;
  }
  $("messages").innerHTML = "";
  if (!data.length) {
    $("messages").innerHTML = '<div class="welcome"><h2>It is quiet in here.</h2><p>Send the first message!</p></div>';
  } else {
    data.forEach(renderMessage);
  }
}

function subscribeToMessages() {
  if (realtimeSubscription) {
    supabaseClient.removeChannel(realtimeSubscription);
  }
  $("connection").textContent = "Connecting…";
  realtimeSubscription = supabaseClient
    .channel("schoolcord-" + currentChannel)
    .on("postgres_changes", {
      event:"INSERT", schema:"public", table:"messages",
      filter:"channel_id=eq." + currentChannel
    }, payload => renderMessage(payload.new))
    .subscribe(state => {
      $("connection").textContent =
        state === "SUBSCRIBED" ? "Live" :
        state === "CHANNEL_ERROR" ? "Connection error" :
        state === "TIMED_OUT" ? "Timed out" : "Connecting…";
    });
}

async function openChannel(channelId) {
  currentChannel = channelId;
  document.querySelectorAll(".channel").forEach(button => {
    button.classList.toggle("active", button.dataset.channel === channelId);
  });
  $("channelTitle").textContent = "# " + channelId;
  $("messageInput").placeholder = "Message #" + channelId + "…";
  await loadMessages();
  subscribeToMessages();
}

async function enterApp(user) {
  currentUser = user;
  currentProfile = await ensureProfile(user);
  $("usernameDisplay").textContent = currentProfile.username;
  $("avatar").textContent = currentProfile.username.charAt(0).toUpperCase();
  showApp();
  await openChannel(currentChannel);
}

authForm.addEventListener("submit", async event => {
  event.preventDefault();
  if (busy) return;
  if (!supabaseClient) {
    setStatus("Add your Supabase project URL and publishable key in the code.");
    return;
  }

  const email = $("email").value.trim();
  const password = $("password").value;
  const username = $("username").value.trim();
  if (signupMode && !/^[A-Za-z0-9_]{3,24}$/.test(username)) {
    setStatus("Use 3–24 letters, numbers or underscores for your username.");
    return;
  }

  busy = true;
  $("authSubmit").disabled = true;
  setStatus(signupMode ? "Creating your account…" : "Logging in…", false);

  try {
    if (signupMode) {
      const {data, error} = await supabaseClient.auth.signUp({
        email, password,
        options: {data: {username}}
      });
      if (error) throw error;

      if (data.session && data.user) {
        await enterApp(data.user);
      } else {
        setStatus("Account created! Check your email to confirm it, then log in.", false);
        signupMode = false;
        configureAuthMode();
        $("email").value = email;
      }
    } else {
      const {data, error} = await supabaseClient.auth.signInWithPassword({email,password});
      if (error) throw error;
      await enterApp(data.user);
    }
  } catch (error) {
    setStatus(error.message || "Something went wrong.");
  } finally {
    busy = false;
    $("authSubmit").disabled = false;
  }
});

$("messageForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (!currentUser || !currentProfile) return;
  const input = $("messageInput");
  const content = input.value.trim();
  if (!content) return;

  $("send").disabled = true;
  setNotice("");
  try {
    const {error} = await supabaseClient.from("messages").insert({
      channel_id:currentChannel,
      user_id:currentUser.id,
      username:currentProfile.username,
      content
    });
    if (error) throw error;
    input.value = "";
  } catch (error) {
    setNotice("Message failed: " + error.message);
  } finally {
    $("send").disabled = false;
    input.focus();
  }
});

document.querySelectorAll(".channel").forEach(button => {
  button.addEventListener("click", () => openChannel(button.dataset.channel));
});

$("logout").addEventListener("click", async () => {
  if (realtimeSubscription) {
    await supabaseClient.removeChannel(realtimeSubscription);
    realtimeSubscription = null;
  }
  const {error} = await supabaseClient.auth.signOut();
  if (error) setNotice(error.message);
  currentUser = null;
  currentProfile = null;
  showAuth();
});

async function start() {
  if (!SUPABASE_URL.startsWith("https://") ||
      SUPABASE_URL === "YOUR_PROJECT_URL" ||
      SUPABASE_KEY === "YOUR_PUBLISHABLE_KEY" ||
      !window.supabase) {
    setStatus("Setup needed: replace YOUR_PROJECT_URL and YOUR_PUBLISHABLE_KEY in index.html.");
    return;
  }

  try {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const {data, error} = await supabaseClient.auth.getSession();
    if (error) throw error;
    if (data.session?.user) {
      try {
        await enterApp(data.session.user);
      } catch (profileError) {
        setStatus("Profile setup failed: " + profileError.message);
        showAuth();
      }
    }
  } catch (error) {
    setStatus("Supabase connection failed: " + error.message);
  }
}

configureAuthMode();
start();
</script>
</body>
</html>
