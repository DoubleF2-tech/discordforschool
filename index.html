async function showRequests(btn){showPanel("Friend requests",btn);const root=$("socialPanel");root.append(el("h2","","Friend requests"));const list=el("div");root.append(list);const{data,error}=await db.from("friend_requests").select("id,sender_id,receiver_id,status,created_at").eq("receiver_id",user.id).eq("status","pending").order("created_at",{ascending:false});if(error){list.textContent="Could not load requests: "+error.message;return}$("requestCount").textContent=data.length?"("+data.length+")":"";if(!data.length){list.textContent="No pending friend requests.";return}for(const r of data){const{data:p,error:pe}=await db.from("profiles").select("id,username,display_name,avatar_url,banner_url,bio,accent_color").eq("id",r.sender_id).maybeSingle();if(pe||!p)continue;list.append(personRow(p,"Wants to be your friend",[{label:"Accept",action:async()=>{const{error:er}=await db.from("friend_requests").update({status:"accepted"}).eq("id",r.id).eq("receiver_id",user.id);if(er){notice("Accept failed: "+er.message);return}const a=await db.from("friendships").upsert({user_id:user.id,friend_id:p.id},{onConflict:"user_id,friend_id"}),b=await db.from("friendships").upsert({user_id:p.id,friend_id:user.id},{onConflict:"user_id,friend_id"});if(a.error||b.error){notice("Accepted, but friend list database permissions need fixing.");return}await loadFriends();await showRequests(btn)}},{label:"Decline",secondary:true,action:async()=>{const{error:er}=await db.from("friend_requests").update({status:"declined"}).eq("id",r.id).eq("receiver_id",user.id);if(er){notice(er.message);return}await showRequests(btn)}}]))}}

async function showProfileEditor(btn){showPanel("My Profile",btn);const root=$("socialPanel");root.append(el("h2","","Customize your profile"),el("p","muted","Changes are saved to your account."));const editor=el("div","profile-editor");editor.innerHTML='<div class="profile-preview"><div class="preview-banner" id="previewBanner"></div><div class="preview-info"><div class="avatar preview-avatar" id="previewAvatar"></div><div class="preview-name" id="previewName"></div><div class="preview-username" id="previewUsername"></div><div class="preview-bio" id="previewBio"></div></div></div><div class="field"><label>Display name</label><input id="editDisplayName" maxlength="32"></div><div class="field"><label>Profile picture URL</label><input id="editAvatar" type="url"></div><div class="field"><label>Banner image URL</label><input id="editBanner" type="url"></div><div class="field"><label>About me</label><textarea id="editBio" maxlength="300"></textarea></div><div class="field"><label>Accent color</label><div class="color-row"><input id="editColor" type="color" value="#5865f2"><span id="colorValue"></span></div></div><button id="saveProfile">Save profile</button><div id="profileStatus" class="muted"></div>';root.append(editor);$("editDisplayName").value=profile.display_name||profile.username;$("editAvatar").value=profile.avatar_url||"";$("editBanner").value=profile.banner_url||"";$("editBio").value=profile.bio||"";$("editColor").value=/^#[0-9a-f]{6}$/i.test(profile.accent_color||"")?profile.accent_color:"#5865f2";function preview(){$("previewName").textContent=$("editDisplayName").value||profile.username;$("previewUsername").textContent="@"+profile.username;$("previewBio").textContent=$("editBio").value||"No bio yet.";$("previewBanner").style.backgroundImage=imageBackground($("editBanner").value)||"linear-gradient(135deg,#5865f2,#282b54)";setAvatar($("previewAvatar"),{username:profile.username,display_name:$("editDisplayName").value,avatar_url:$("editAvatar").value});$("previewName").style.color=$("editColor").value;$("colorValue").textContent=$("editColor").value}["editDisplayName","editAvatar","editBanner","editBio","editColor"].forEach(id=>$(id).addEventListener("input",preview));preview();$("saveProfile").onclick=async()=>{const msg=$("profileStatus"),display_name=$("editDisplayName").value.trim(),avatar_url=$("editAvatar").value.trim(),banner_url=$("editBanner").value.trim(),bio=$("editBio").value.trim(),accent_color=$("editColor").value;if(!display_name||display_name.length>32){msg.textContent="Display name must be 1–32 characters.";return}if(avatar_url&&!safeUrl(avatar_url)||banner_url&&!safeUrl(banner_url)){msg.textContent="Use valid HTTP or HTTPS image URLs.";return}const{data,error}=await db.from("profiles").update({display_name,avatar_url:avatar_url||null,banner_url:banner_url||null,bio,accent_color}).eq("id",user.id).select("id,username,display_name,avatar_url,banner_url,bio,accent_color").single();if(error){msg.textContent="Save failed: "+error.message;return}profile=data;profileCache.set(profile.id,profile);setAppearance();msg.textContent="Profile saved!"}}
async function viewProfile(id){try{const p=await getProfile(id);if(!p){notice("Profile not found.");return}showPanel("Profile");const root=$("socialPanel"),card=el("div","public-profile"),banner=el("div","profile-banner");banner.style.backgroundImage=imageBackground(p.banner_url)||"linear-gradient(135deg,#5865f2,#282b54)";const info=el("div","public-profile-info"),av=el("div","avatar preview-avatar");setAvatar(av,p);const name=el("div","preview-name",p.display_name||p.username);name.style.color=p.accent_color||"#5865f2";name.insertAdjacentHTML("beforeend",roleBadge(p.username));const uname=el("div","preview-username","@"+p.username),bio=el("div","preview-bio",p.bio||"No bio yet.");info.append(av,name,uname,bio);card.append(banner,info);root.append(card);if(id===user.id){const b=el("button","","Edit my profile");b.onclick=()=>showProfileEditor(document.querySelector('[data-view="profile"]'));root.append(b)}else if(friends.some(f=>f.id===id)){const b=el("button","","Message");b.onclick=()=>openDM(p);root.append(b)}else{const b=el("button","","Add friend");b.onclick=async()=>{const{data:rs,error}=await db.from("friend_requests").select("sender_id,receiver_id,status").or("sender_id.eq."+user.id+",receiver_id.eq."+id);if(error){notice(error.message);return}if((rs||[]).some(r=>r.status==="pending"||r.status==="accepted")){notice("Request already exists or you are already friends.");return}const{error:er}=await db.from("friend_requests").insert({sender_id:user.id,receiver_id:id,status:"pending"});notice(er?"Could not send request: "+er.message:"Friend request sent!")};root.append(b)}if(staff()&&id!==user.id&&!["gigawatts","emperorpod2005"].includes(String(p.username).toLowerCase())){const{data:bans,error}=await db.from("user_bans").select("user_id,reason").eq("user_id",id).maybeSingle();if(error){root.append(el("p","muted","Ban controls unavailable: "+error.message));return}if(bans){root.append(el("p","muted","This user is banned. Reason: "+bans.reason));const un=el("button","secondary","Unban user");un.onclick=async()=>{if(!confirm("Unban @"+p.username+"?"))return;const{error:er}=await db.rpc("schoolcord_unban_user",{target_user_id:id});notice(er?"Unban failed: "+er.message:"User unbanned.");if(!er)viewProfile(id)};root.append(un)}else{const ban=el("button","danger","Ban user");ban.onclick=async()=>{const reason=prompt("Reason for banning @"+p.username+":","No reason provided");if(reason===null)return;const{error:er}=await db.rpc("schoolcord_ban_user",{target_user_id:id,ban_reason:reason});notice(er?"Ban failed: "+er.message:"User banned.");if(!er)viewProfile(id)};root.append(ban)}}}catch(e){showPanel("Profile");$("socialPanel").textContent="Could not load profile: "+e.message}}
async function loadDMs(){const f=dmFriend;$("messages").replaceChildren();welcome("Loading direct messages…","Please wait.");const{data,error}=await db.from("direct_messages").select("id,sender_id,recipient_id,content,created_at").or("and(sender_id.eq."+user.id+",recipient_id.eq."+f.id+"),and(sender_id.eq."+f.id+",recipient_id.eq."+user.id+")").order("created_at",{ascending:true}).limit(200);if(error){welcome("Could not load DMs",error.message);return}$("messages").replaceChildren();if(!data?.length)welcome("Start your conversation","Send a private message to @"+(f.display_name||f.username)+".");for(const m of data){const sender=m.sender_id===user.id?profile:await getProfile(m.sender_id);await renderMessage({...m,user_id:m.sender_id,username:sender?.username||"User"})}}
async function openDM(friend,btn){await clearSubs();view="dm";dmFriend=friend;$("socialPanel").classList.add("hidden");$("messages").classList.remove("hidden");$("composer").classList.remove("hidden");$("messageInput").disabled=false;$("viewTitle").textContent="@ "+(friend.display_name||friend.username);$("messageInput").placeholder="Message @"+(friend.display_name||friend.username)+"…";activeNav(btn);await loadDMs();dmSubscription=db.channel("sc-dm-"+user.id+"-"+friend.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"direct_messages",filter:"recipient_id=eq."+user.id},async p=>{const m=p.new;if(view==="dm"&&dmFriend?.id===m.sender_id){const sender=await getProfile(m.sender_id);renderMessage({...m,user_id:m.sender_id,username:sender?.username||"User"},true)}}).subscribe(s=>{$("connection").textContent=s==="SUBSCRIBED"?"Live":s==="CHANNEL_ERROR"?"Connection error":"Connecting…"})}
async function enterApp(u){user=u;profile=await ensureProfile(u);const{data:banData,error:banError}=await db.rpc("schoolcord_check_ban");if(banError)throw Error("Could not check ban status: "+banError.message+" — run the ban SQL in Supabase first.");if(banData?.[0]?.banned){await db.auth.signOut();user=null;profile=null;showAuth();status("This SchoolCord account is banned. Reason: "+(banData[0].ban_reason||"No reason provided"));return}setAppearance();await loadFriends();showApp();await openChannel("general");const{data:reqs,error}=await db.from("friend_requests").select("id").eq("receiver_id",user.id).eq("status","pending");if(!error)$("requestCount").textContent=reqs?.length?"("+reqs.length+")":""}
$("authForm").addEventListener("submit",async e=>{e.preventDefault();if(busy)return;if(!window.supabase){status("Supabase library failed to load.");return}const email=$("email").value.trim(),password=$("password").value,username=$("username").value.trim();if(signup&&!/^[A-Za-z0-9_]{3,24}$/.test(username)){status("Use 3–24 letters, numbers or underscores.");return}busy=true;$("authSubmit").disabled=true;status(signup?"Creating account…":"Logging in…",true);try{if(signup){const{data,error}=await db.auth.signUp({email,password,options:{data:{username},emailRedirectTo:location.origin+location.pathname}});if(error)throw error;if(data.session&&data.user)await enterApp(data.user);else{status("Account created! Check your email to confirm it, then log in.",true);signup=false;authMode();$("email").value=email}}else{const{data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;await enterApp(data.user)}}catch(err){status(err.message||"Something went wrong.")}finally{busy=false;$("authSubmit").disabled=false}});
$("messageForm").addEventListener("submit",async e=>{e.preventDefault();if(!user||!profile)return;const input=$("messageInput"),content=input.value.trim();if(!content)return;$("send").disabled=true;notice("");try{let result;if(view==="dm"&&dmFriend)result=await db.from("direct_messages").insert({sender_id:user.id,recipient_id:dmFriend.id,content});else if(view==="channel")result=await db.from("messages").insert({channel_id:channel,user_id:user.id,username:profile.username,content});else return;if(result.error)throw result.error;input.value=""}catch(err){notice("Message failed: "+err.message)}finally{$("send").disabled=false;input.focus()}});
document.querySelectorAll('[data-view="channel"]').forEach(b=>b.onclick=()=>openChannel(b.dataset.channel,b));document.querySelector('[data-view="profile"]').onclick=e=>showProfileEditor(e.currentTarget);document.querySelector('[data-view="friends"]').onclick=e=>showFriends(e.currentTarget);document.querySelector('[data-view="requests"]').onclick=e=>showRequests(e.currentTarget);document.querySelector('[data-view="add"]').onclick=e=>showAddFriends(e.currentTarget);$("logout").onclick=async()=>{await clearSubs();await db.auth.signOut();user=null;profile=null;friends=[];profileCache.clear();showAuth()};
async function start(){if(!window.supabase){status("Supabase library failed to load.");return}try{db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const{data,error}=await db.auth.getSession();if(error)throw error;if(data.session?.user){try{await enterApp(data.session.user)}catch(err){status("Profile could not load: "+err.message);showAuth()}}}catch(err){status("Supabase connection failed: "+err.message)}}authMode();start();
</script></body></html>
