
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5865f2">
<title>SchoolCord</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#1e1f22;--panel:#2b2d31;--side:#232428;--accent:#5865f2;--text:#f2f3f5;--muted:#b5bac1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer;border:0;border-radius:5px;padding:10px 13px;background:var(--accent);color:white;font-weight:bold}
button:disabled{opacity:.5;cursor:not-allowed}
input{width:100%;padding:11px;border-radius:5px;border:1px solid #41434a;background:#1e1f22;color:white}
.hidden{display:none!important}
.muted,small{color:var(--muted)}
#auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#343b75,#1e1f22 65%)}
.authbox{width:min(420px,100%);background:var(--panel);padding:30px;border-radius:12px;box-shadow:0 15px 55px #0005}
.logo{font-size:28px;font-weight:800;letter-spacing:-1px}
.logo span,.brand span{color:#8290ff}
.stack{display:grid;gap:14px;margin-top:22px}
.stack label{display:block;margin-bottom:6px}
#status{min-height:20px;color:#ffb4b4;overflow-wrap:anywhere;font-size:13px}
.switch{text-align:center;margin-top:18px;color:var(--muted)}
.switch button{background:none;color:#aab4ff;padding:4px}
#app{height:100dvh;display:grid;grid-template-columns:230px minmax(0,1fr);overflow:hidden}
.sidebar{background:var(--side);padding:14px 10px;display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.brand{padding:8px 10px 20px;font-size:23px;font-weight:bold}
.server{padding:12px;background:#2b2d31;border-radius:7px;margin-bottom:12px;font-weight:bold}
.section{font-size:11px;color:var(--muted);font-weight:bold;text-transform:uppercase;padding:13px 10px 6px}
.navbtn{display:block;text-align:left;width:100%;background:transparent;color:var(--muted);padding:10px;font-weight:normal;margin:2px 0}
.navbtn:hover,.navbtn.active{background:#393b43;color:white}
.userbox{margin-top:auto;padding:12px 8px;background:#191a1d;border-radius:7px;overflow-wrap:anywhere}
.userline{display:flex;gap:8px;align-items:center}
.avatar{width:35px;height:35px;flex-shrink:0;border-radius:50%;background:#5865f2;display:grid;place-items:center;font-weight:bold}
#logout{background:#393b43;margin-top:12px;width:100%}
.chat{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{min-height:61px;flex-shrink:0;border-bottom:1px solid #191a1d;display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:12px}
.topbar h2{font-size:17px;margin:0}
#connection{font-size:12px;color:var(--muted)}
#messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.welcome{margin:auto;text-align:center;max-width:430px;color:var(--muted);line-height:1.6}
.message{display:flex;gap:12px;align-items:flex-start}
.messagebody{min-width:0;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.5}
.messagehead{margin-bottom:5px}
.messagehead strong{font-size:14px}
.messagehead time{font-size:11px;color:var(--muted);margin-left:8px}
.composer{padding:0 20px 16px}
.composer form{display:flex;gap:10px;background:#383a40;padding:10px;border-radius:9px}
.composer input{border:0;background:transparent;min-width:0}
#notice{min-height:20px;color:var(--muted);font-size:12px;padding:4px}
.panel{padding:22px;overflow-y:auto;flex:1}
.panel h2{margin-top:0}
.panel form{display:flex;gap:8px;margin:15px 0}
.panel form input{min-width:0}
.person{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #393b43}
.person .personinfo{flex:1;min-width:0;overflow-wrap:anywhere}
.person button{margin:2px;font-size:12px}
.secondary{background:#41434a}
.success{color:#a5f3c1}
.danger{background:#a83b46}
.tag{font-size:11px;background:#41434a;border-radius:5px;padding:4px 6px;margin-left:6px}
@media(max-width:650px){
#app{grid-template-columns:78px minmax(0,1fr)}
.sidebar{padding:9px 5px}
.brand{font-size:0;text-align:center;padding:10px 0 18px}
.brand:after{content:"SC";font-size:20px}
.server{font-size:0;text-align:center;padding:12px 0}
.server:after{content:"S";font-size:17px}
.section{font-size:0;padding:8px 0}
.navbtn{font-size:0;text-align:center;padding:13px 2px}
.navbtn:before{content:"•";font-size:21px}
.userbox{padding:8px 3px;text-align:center}
.userline{justify-content:center}
#usernameDisplay{display:none}
#logout{font-size:0;padding:9px 0}
#logout:after{content:"↪";font-size:18px}
.topbar{padding:0 10px}
#messages{padding:14px 10px}
.composer{padding:0 8px 10px}
.composer form{gap:5px;padding:7px}
.composer button{padding:10px}
.panel{padding:14px 10px}
.person{flex-wrap:wrap}
}
</style>
</head>
<body>
<section id="auth">
<div class="authbox">
<div class="logo">School<span>Cord</span></div>
<h2 id="authTitle">Welcome back!</h2>
<p id="authDescription" class="muted">Sign in to join your community.</p>
<form id="authForm" class="stack">
<div id="usernameField" class="hidden">
<label for="username">Username</label>
<input id="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" autocomplete="username" placeholder="Choose a username">
<small>3–24 letters, numbers or underscores.</small>
</div>
<div><label for="email">Email address</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"></div>
<div><label for="password">Password</label><input id="password" type="password" required minlength="8" autocomplete="current-password" placeholder="At least 8 characters"></div>
<button id="authSubmit" type="submit">Log in</button>
<div id="status" role="status" aria-live="polite"></div>
</form>
<div class="switch"><span id="switchText">New to SchoolCord?</span> <button id="switchMode" type="button">Create an account</button></div>
</div>
</section>

<section id="app" class="hidden">
<aside class="sidebar">
<div class="brand">School<span>Cord</span></div>
<div class="server">SchoolCord Community</div>
<div class="section">Text channels</div>
<nav aria-label="Channels">
<button class="navbtn active" data-view="channel" data-channel="general"># general</button>
<button class="navbtn" data-view="channel" data-channel="introductions"># introductions</button>
<button class="navbtn" data-view="channel" data-channel="gaming"># gaming</button>
<button class="navbtn" data-view="channel" data-channel="help"># help</button>
</nav>
<div class="section">Social</div>
<nav>
<button class="navbtn" data-view="friends">♙ Friends</button>
<button class="navbtn" data-view="requests">✉ Friend requests <span id="requestCount"></span></button>
<button class="navbtn" data-view="add">＋ Add friends</button>
</nav>
<div class="section">Direct messages</div>
<nav id="dmList"></nav>
<div class="userbox">
<div class="userline"><div class="avatar" id="avatar">?</div>
<div><strong id="usernameDisplay">User</strong><div id="roleLabel" class="muted"></div></div></div>
<button id="logout" type="button">Log out</button>
</div>
</aside>
<main class="chat">
<header class="topbar"><h2 id="viewTitle"># general</h2><span id="connection">Connecting…</span></header>
<div id="messages"><div class="welcome"><h2>Welcome to SchoolCord!</h2><p>Messages will appear here.</p></div></div>
<div id="socialPanel" class="panel hidden"></div>
<div class="composer" id="composer">
<form id="messageForm"><input id="messageInput" maxlength="2000" autocomplete="off" placeholder="Message #general…" aria-label="Message" required><button id="send" type="submit">Send</button></form>
<div id="notice" role="status" aria-live="polite"></div>
</div>
</main>
</section>

<script>
const SUPABASE_URL="https://bqvpsbcvdivuajehocag.supabase.co";
const SUPABASE_KEY="sb_publishable_qHH0hRblnYrf1Fv_Urv8qg_rvtX3xGU";
const $=id=>document.getElementById(id);
let db=null,user=null,profile=null,channel="general",subscription=null,dmSubscription=null;
let signup=false,busy=false,view="channel",dmFriend=null,friends=[],owner=false;

function status(msg,ok=false){$("status").textContent=msg;$("status").style.color=ok?"#a5f3c1":"#ffb4b4"}
function notice(msg){$("notice").textContent=msg}
function showApp(){$("auth").classList.add("hidden");$("app").classList.remove("hidden")}
function showAuth(){$("app").classList.add("hidden");$("auth").classList.remove("hidden")}
function escapeText(s){return String(s??"")}
function showWelcome(title,text){
$("messages").innerHTML="";
const w=document.createElement("div");w.className="welcome";
const h=document.createElement("h2");h.textContent=title;
const p=document.createElement("p");p.textContent=text;
w.append(h,p);$("messages").append(w);
}
function authMode(){
$("authTitle").textContent=signup?"Create your account":"Welcome back!";
$("authDescription").textContent=signup?"Create an account to join SchoolCord.":"Sign in to join your community.";
$("usernameField").classList.toggle("hidden",!signup);
$("username").required=signup;
$("authSubmit").textContent=signup?"Create account":"Log in";
$("switchText").textContent=signup?"Already have an account?":"New to SchoolCord?";
$("switchMode").textContent=signup?"Log in":"Create an account";
$("password").autocomplete=signup?"new-password":"current-password";
status("");
}
$("switchMode").onclick=()=>{signup=!signup;authMode()};

function addMessage(m,dm=false){
if($("message-"+m.id))return;
const welcome=$("messages").querySelector(".welcome");if(welcome)welcome.remove();
const item=document.createElement("article");item.className="message";item.id="message-"+m.id;
const av=document.createElement("div");av.className="avatar";av.textContent=(m.username||"?").charAt(0).toUpperCase();
const body=document.createElement("div");body.className="messagebody";
const head=document.createElement("div");head.className="messagehead";
const name=document.createElement("strong");name.textContent=m.username||"User";
const time=document.createElement("time");const date=new Date(m.created_at);
time.textContent=Number.isNaN(date.getTime())?"":date.toLocaleString();
const content=document.createElement("div");content.textContent=m.content;
head.append(name,time);body.append(head,content);item.append(av,body);$("messages").append(item);
$("messages").scrollTop=$("messages").scrollHeight;
}

async function ensureProfile(u){
let {data:p,error}=await db.from("profiles").select("id,username").eq("id",u.id).maybeSingle();
if(error)throw error;
if(!p){
const wanted=u.user_metadata?.username;
if(!wanted)throw new Error("Profile missing. Please contact the site administrator.");
const result=await db.from("profiles").insert({id:u.id,username:wanted}).select("id,username").single();
if(result.error){
const retry=await db.from("profiles").select("id,username").eq("id",u.id).maybeSingle();
if(retry.error||!retry.data)throw result.error;
p=retry.data;
}else p=result.data;
}
return p;
}

async function checkOwner(){
owner=false;
try{
const {data,error}=await db.rpc("schoolcord_is_owner");
if(error)throw error;
owner=data===true;
}catch(e){console.warn("Owner check unavailable:",e.message)}
$("roleLabel").textContent=owner?"Owner":"";
}

function setNavActive(selector){
document.querySelectorAll(".navbtn").forEach(b=>b.classList.remove("active"));
if(selector)selector.classList.add("active");
}
async function clearSubscriptions(){
if(subscription){await db.removeChannel(subscription);subscription=null}
if(dmSubscription){await db.removeChannel(dmSubscription);dmSubscription=null}
}
function subscribeChannel(){
if(subscription)db.removeChannel(subscription);
$("connection").textContent="Connecting…";
subscription=db.channel("schoolcord-channel-"+channel)
.on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"channel_id=eq."+channel},p=>{if(view==="channel")addMessage(p.new)})
.subscribe(s=>{$("connection").textContent=s==="SUBSCRIBED"?"Live":s==="CHANNEL_ERROR"?"Connection error":"Connecting…"});
}
async function loadChannelMessages(){
$("messages").innerHTML="";showWelcome("Loading messages…","Please wait.");
const {data,error}=await db.from("messages").select("id,channel_id,user_id,username,content,created_at").eq("channel_id",channel).order("created_at",{ascending:true}).limit(100);
if(error){showWelcome("Could not load messages",error.message);return}
$("messages").innerHTML="";
if(!data.length)showWelcome("It is quiet in here.","Send the first message!");
else data.forEach(m=>addMessage(m));
}
async function openChannel(id,btn){
await clearSubscriptions();
view="channel";channel=id;dmFriend=null;
$("socialPanel").classList.add("hidden");$("messages").classList.remove("hidden");
$("composer").classList.remove("hidden");$("messageInput").disabled=false;
$("viewTitle").textContent="# "+id;$("messageInput").placeholder="Message #"+id+"…";
setNavActive(btn||document.querySelector('[data-view="channel"][data-channel="'+id+'"]'));
await loadChannelMessages();subscribeChannel();
}
async function openDM(friend,btn){
await clearSubscriptions();
view="dm";dmFriend=friend;
$("socialPanel").classList.add("hidden");$("messages").classList.remove("hidden");
$("composer").classList.remove("hidden");$("messageInput").disabled=false;
$("viewTitle").textContent="@ "+friend.username;
$("messageInput").placeholder="Message @"+friend.username+"…";
setNavActive(btn);
await loadDMs();subscribeDMs();
}
function showPanel(title,html,btn){
view=title;$("viewTitle").textContent=title;
$("messages").classList.add("hidden");$("composer").classList.add("hidden");
$("socialPanel").classList.remove("hidden");$("socialPanel").innerHTML=html;
setNavActive(btn);notice("");
}

async function loadFriends(){
const {data,error}=await db.from("friendships").select("friend_id").eq("user_id",user.id);
if(error)throw error;
const ids=(data||[]).map(x=>x.friend_id);
if(!ids.length){friends=[];renderDMList();return}
const {data:profiles,error:pe}=await db.from("profiles").select("id,username").in("id",ids);
if(pe)throw pe;
friends=profiles||[];renderDMList();
}
function renderDMList(){
const nav=$("dmList");nav.innerHTML="";
if(!friends.length){const small=document.createElement("small");small.textContent="No DMs yet";nav.append(small);return}
friends.forEach(f=>{
const b=document.createElement("button");b.className="navbtn";b.textContent="@ "+f.username;
b.onclick=()=>openDM(f,b);nav.append(b);
});
}
function personRow(username,description,buttons){
const row=document.createElement("div");row.className="person";
const av=document.createElement("div");av.className="avatar";av.textContent=(username||"?").charAt(0).toUpperCase();
const info=document.createElement("div");info.className="personinfo";
const strong=document.createElement("strong");strong.textContent=username;
const small=document.createElement("div");small.className="muted";small.textContent=description||"";
info.append(strong,small);row.append(av,info);
buttons.forEach(item=>{const b=document.createElement("button");b.textContent=item.label;if(item.secondary)b.className="secondary";if(item.danger)b.className="danger";b.onclick=item.action;row.append(b)});
return row;
}
async function showFriends(btn){
await loadFriends();
showPanel("Friends",'<h2>Your friends</h2><p class="muted">Open a direct message with a friend.</p><div id="friendRows"></div>',btn);
const list=$("friendRows");
if(!friends.length){list.textContent="You haven't added any friends yet. Use Add friends to find people.";return}
friends.forEach(f=>list.append(personRow(f.username,"SchoolCord friend",[{label:"Message",action:()=>openDM(f)}])));
}
async function showAddFriends(btn){
showPanel("Add friends",'<h2>Add friends</h2><p class="muted">Search by exact or partial username.</p><form id="searchForm"><input id="searchUser" maxlength="24" placeholder="Search username…" required><button>Search</button></form><div id="searchResults"></div>',btn);
$("searchForm").onsubmit=async e=>{
e.preventDefault();const q=$("searchUser").value.trim();
if(q.length<2){$("searchResults").textContent="Enter at least two characters.";return}
$("searchResults").textContent="Searching…";
const {data,error}=await db.from("profiles").select("id,username").ilike("username","%"+q+"%").limit(20);
if(error){$("searchResults").textContent="Search failed: "+error.message;return}
const out=$("searchResults");out.innerHTML="";
const results=(data||[]).filter(p=>p.id!==user.id);
if(!results.length){out.textContent="No matching users found.";return}
const {data:reqs}=await db.from("friend_requests").select("sender_id,receiver_id,status").or("sender_id.eq."+user.id+",receiver_id.eq."+user.id);
for(const p of results){
const isFriend=friends.some(f=>f.id===p.id);
const existing=(reqs||[]).find(r=>(r.sender_id===user.id&&r.receiver_id===p.id)||(r.sender_id===p.id&&r.receiver_id===user.id));
let buttons=[];
if(isFriend)buttons=[{label:"Message",action:()=>openDM(p)}];
else if(existing?.status==="pending")buttons=[{label:existing.sender_id===user.id?"Request sent":"They requested you",secondary:true,action:()=>{}}];
else if(existing?.status==="accepted")buttons=[{label:"Already friends",secondary:true,action:()=>{}}];
else buttons=[{label:"Add friend",action:async()=>{
const {error:er}=await db.from("friend_requests").insert({sender_id:user.id,receiver_id:p.id});
if(er){notice("Could not send request: "+er.message);return}
notice("Friend request sent to "+p.username+".");showAddFriends(btn);
}}];
out.append(personRow(p.username,"SchoolCord user",buttons));
}
};
}
async function showRequests(btn){
const {data,error}=await db.from("friend_requests").select("id,sender_id,receiver_id,status,created_at").eq("receiver_id",user.id).eq("status","pending").order("created_at",{ascending:false});
if(error){showPanel("Friend requests","");$("socialPanel").textContent="Could not load requests: "+error.message;return}
$("requestCount").textContent=data.length?"("+data.length+")":"";
showPanel("Friend requests",'<h2>Friend requests</h2><div id="requestRows"></div>',btn);
const list=$("requestRows");
if(!data.length){list.textContent="No pending friend requests.";return}
for(const r of data){
const {data:p}=await db.from("profiles").select("id,username").eq("id",r.sender_id).maybeSingle();
if(!p)continue;
list.append(personRow(p.username,"Wants to be your friend",[
{label:"Accept",action:async()=>{
const {error:er}=await db.from("friend_requests").update({status:"accepted"}).eq("id",r.id).eq("receiver_id",user.id);
if(er){notice("Accept failed: "+er.message);return}
notice("You are now friends with "+p.username+".");await loadFriends();await showRequests(btn);
}},
{label:"Decline",secondary:true,action:async()=>{
const {error:er}=await db.from("friend_requests").update({status:"declined"}).eq("id",r.id).eq("receiver_id",user.id);
if(er){notice("Decline failed: "+er.message);return}
await showRequests(btn);
}}
]));
}
}
async function loadDMs(){
const f=dmFriend;
$("messages").innerHTML="";showWelcome("Loading direct messages…","Please wait.");
const {data,error}=await db.from("direct_messages").select("id,sender_id,recipient_id,content,created_at").or("and(sender_id.eq."+user.id+",recipient_id.eq."+f.id+"),and(sender_id.eq."+f.id+",recipient_id.eq."+user.id+")").order("created_at",{ascending:true}).limit(200);
if(error){showWelcome("Could not load DMs",error.message);notice(error.message);return}
$("messages").innerHTML="";
if(!data.length)showWelcome("Start your conversation","Send a private message to @"+f.username+".");
for(const m of data){
const name=m.sender_id===user.id?profile.username:f.username;
addMessage({...m,username:name});
}
}
function subscribeDMs(){
if(dmSubscription)db.removeChannel(dmSubscription);
dmSubscription=db.channel("schoolcord-dms-"+user.id)
.on("postgres_changes",{event:"INSERT",schema:"public",table:"direct_messages"},async p=>{
const m=p.new;
if(view!=="dm"||!dmFriend)return;
if(!((m.sender_id===user.id&&m.recipient_id===dmFriend.id)||(m.sender_id===dmFriend.id&&m.recipient_id===user.id)))return;
const name=m.sender_id===user.id?profile.username:dmFriend.username;
addMessage({...m,username:name});
}).subscribe(s=>{$("connection").textContent=s==="SUBSCRIBED"?"Live":s==="CHANNEL_ERROR"?"Connection error":"Connecting…"});
}

$("authForm").addEventListener("submit",async e=>{
e.preventDefault();if(busy)return;
if(!db){status("Supabase has not initialized.");return}
const email=$("email").value.trim(),password=$("password").value,username=$("username").value.trim();
if(signup&&!/^[A-Za-z0-9_]{3,24}$/.test(username)){status("Use 3–24 letters, numbers or underscores.");return}
busy=true;$("authSubmit").disabled=true;status(signup?"Creating account…":"Logging in…",true);
try{
if(signup){
const {data,error}=await db.auth.signUp({email,password,options:{data:{username},emailRedirectTo:location.origin+location.pathname}});
if(error)throw error;
if(data.session&&data.user){await enterApp(data.user)}
else{status("Account created! Check your email to confirm it, then log in.",true);signup=false;authMode();$("email").value=email}
}else{
const {data,error}=await db.auth.signInWithPassword({email,password});
if(error)throw error;await enterApp(data.user);
}
}catch(err){status(err.message||"Something went wrong.")}
finally{busy=false;$("authSubmit").disabled=false}
});

async function enterApp(u){
user=u;profile=await ensureProfile(u);
$("usernameDisplay").textContent=profile.username;
$("avatar").textContent=profile.username.charAt(0).toUpperCase();
await checkOwner();await loadFriends();
showApp();await openChannel("general");
}
$("messageForm").addEventListener("submit",async e=>{
e.preventDefault();if(!user||!profile)return;
const input=$("messageInput"),content=input.value.trim();if(!content)return;
$("send").disabled=true;notice("");
try{
let result;
if(view==="dm"&&dmFriend){
result=await db.from("direct_messages").insert({sender_id:user.id,recipient_id:dmFriend.id,content});
}else if(view==="channel"){
result=await db.from("messages").insert({channel_id:channel,user_id:user.id,username:profile.username,content});
}else return;
if(result.error)throw result.error;
input.value="";
}catch(err){notice("Message failed: "+err.message)}
finally{$("send").disabled=false;input.focus()}
});

document.querySelectorAll('[data-view="channel"]').forEach(b=>b.onclick=()=>openChannel(b.dataset.channel,b));
document.querySelector('[data-view="friends"]').onclick=e=>showFriends(e.currentTarget);
document.querySelector('[data-view="requests"]').onclick=e=>showRequests(e.currentTarget);
document.querySelector('[data-view="add"]').onclick=e=>showAddFriends(e.currentTarget);

$("logout").onclick=async()=>{
await clearSubscriptions();
const {error}=await db.auth.signOut();
if(error){notice(error.message);return}
user=null;profile=null;friends=[];owner=false;showAuth();
};

async function start(){
if(!window.supabase){status("Supabase library failed to load.");return}
try{
db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const {data,error}=await db.auth.getSession();if(error)throw error;
if(data.session?.user){
try{await enterApp(data.session.user)}
catch(err){status("Profile setup failed: "+err.message);showAuth()}
}
}catch(err){status("Supabase connection failed: "+err.message)}
}
authMode();start();
</script>
</body>
